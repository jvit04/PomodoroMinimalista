<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Station</title>
  <style>
    :root {
      --bg-panel: rgba(15, 15, 20, 0.82);
      --border-panel: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-work: #10b981;
      --accent-break: #3b82f6;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #060709;
      font-family: var(--font-sans);
      color: var(--text-main);
    }

    /* ==========================================================================
       FONDO TIPOGRÁFICO INMENSO (Cruda Verdad / Focus)
       ========================================================================== */
    .typography-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      padding: 2rem;
    }

    .huge-text {
      font-size: clamp(4rem, 12vw, 15rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.025);
      text-align: center;
      line-height: 0.9;
      transition: opacity 0.5s ease, transform 0.5s ease;
      cursor: pointer;
      pointer-events: auto;
    }

    .huge-text:hover {
      color: rgba(255, 255, 255, 0.045);
    }

    /* Contenedor invisible para el audio de YouTube */
    #ytAudioContainer {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       INTERFAZ DE USUARIO (UI)
       ========================================================================== */
    .ui-layer {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .video-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0.4;
      transition: opacity 0.2s ease;
    }

    .video-controls:hover, .video-controls:focus-within {
      opacity: 1;
    }

    input[type="text"] {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-panel);
      color: var(--text-main);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      width: 190px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--text-muted);
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-panel);
      color: var(--text-main);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    button:active {
      transform: scale(0.97);
    }

    button.active-preset {
      border-color: var(--accent-work);
      color: var(--accent-work);
    }

    /* Widget Central del Temporizador */
    .pomodoro-widget {
      align-self: center;
      margin-bottom: 2rem;
      text-align: center;
      min-width: 290px;
      padding: 1.25rem 1.75rem;
    }

    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-work);
    }

    .badge.break-mode {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-break);
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: 3.75rem;
      font-weight: 700;
      line-height: 1.1;
      margin: 0.5rem 0 1rem 0;
      letter-spacing: -0.03em;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--text-main);
      color: #060709;
      font-weight: 600;
      padding: 0.5rem 1.2rem;
    }

    .btn-primary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>

  <!-- FONDO TIPOGRÁFICO INMENSO -->
  <div class="typography-bg">
    <h1 class="huge-text" id="quoteText" title="Haz clic para cambiar frase">CREA TU FUTURO</h1>
  </div>

  <!-- REPRODUCTOR DE AUDIO OCASIONAL -->
  <div id="ytAudioContainer">
    <div id="ytPlayer"></div>
  </div>

  <!-- INTERFAZ DE USUARIO -->
  <main class="ui-layer">
    
    <header class="top-bar">
      <div class="panel video-controls">
        <input type="text" id="ytInput" placeholder="URL o ID de audio YouTube..." title="Pega cualquier enlace de YouTube para reproducir solo su audio">
        <button id="btnLoadVideo" title="Cambiar audio de fondo">Cargar Audio</button>
        <button id="btnToggleMute" title="Silenciar / Activar audio">🔊</button>
      </div>

      <div class="panel video-controls">
        <span style="font-size: 0.75rem; color: var(--text-muted);">Ciclo:</span>
        <button id="btnPreset25" class="active-preset" title="25m Trabajo / 5m Descanso">25/5</button>
        <button id="btnPreset50" title="50m Trabajo / 10m Descanso">50/10</button>
      </div>
    </header>

    <section class="panel pomodoro-widget">
      <div class="status-header">
        <span id="modeBadge" class="badge">Enfoque</span>
        <span id="cycleCounter">Ciclo #1</span>
      </div>

      <div id="timerDisplay" class="timer-display">25:00</div>

      <div class="timer-controls">
        <button id="btnStartPause" class="btn-primary">Iniciar</button>
        <button id="btnReset" title="Reiniciar ciclo actual">Reiniciar</button>
        <button id="btnSkip" title="Saltar al siguiente estado">Saltar ⏭</button>
      </div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = 'focus_station_config';
    const DEFAULT_VIDEO_ID = 'jfKfPfyJRdk';

    const quotes = [
      "CREA TU FUTURO",
      "SIN EXCUSAS",
      "SIGUE AVANZANDO",
      "EL TIEMPO NO REGRESA",
      "DISCIPLINA > MOTIVACIÓN",
      "MENOS EXCUSAS",
      "HAZLO AHORA",
      "MANTÉN EL RITMO"
    ];
    let quoteIndex = 0;

    const state = {
      videoId: localStorage.getItem(STORAGE_KEY) || DEFAULT_VIDEO_ID,
      workTime: 25 * 60,
      shortBreak: 5 * 60,
      longBreak: 15 * 60,
      currentMode: 'work',
      timeLeft: 25 * 60,
      cyclesCompleted: 0,
      isRunning: false,
      endTime: null,
      timerInterval: null
    };

    const dom = {
      timerDisplay: document.getElementById('timerDisplay'),
      modeBadge: document.getElementById('modeBadge'),
      cycleCounter: document.getElementById('cycleCounter'),
      btnStartPause: document.getElementById('btnStartPause'),
      btnReset: document.getElementById('btnReset'),
      btnSkip: document.getElementById('btnSkip'),
      ytInput: document.getElementById('ytInput'),
      btnLoadVideo: document.getElementById('btnLoadVideo'),
      btnToggleMute: document.getElementById('btnToggleMute'),
      quoteText: document.getElementById('quoteText'),
      btnPreset25: document.getElementById('btnPreset25'),
      btnPreset50: document.getElementById('btnPreset50')
    };

    dom.quoteText.addEventListener('click', () => {
      quoteIndex = (quoteIndex + 1) % quotes.length;
      dom.quoteText.style.opacity = '0';
      setTimeout(() => {
        dom.quoteText.textContent = quotes[quoteIndex];
        dom.quoteText.style.opacity = '1';
      }, 150);
    });

    let audioCtx = null;
    function playNotificationSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        
        if (type === 'work') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.18);
        } else {
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.setValueAtTime(440.00, now + 0.2);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.2, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
        osc.start(now);
        osc.stop(now + 0.95);
      } catch (e) {}
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateUI() {
      const formatted = formatTime(state.timeLeft);
      dom.timerDisplay.textContent = formatted;
      document.title = `(${formatted}) ${state.currentMode === 'work' ? 'Enfoque' : 'Descanso'}`;

      if (state.currentMode === 'work') {
        dom.modeBadge.textContent = 'Enfoque';
        dom.modeBadge.className = 'badge';
      } else if (state.currentMode === 'shortBreak') {
        dom.modeBadge.textContent = 'Descanso Corto';
        dom.modeBadge.className = 'badge break-mode';
      } else {
        dom.modeBadge.textContent = 'Descanso Largo';
        dom.modeBadge.className = 'badge break-mode';
      }

      dom.cycleCounter.textContent = `Ciclo #${state.cyclesCompleted + 1}`;
      dom.btnStartPause.textContent = state.isRunning ? 'Pausar' : 'Iniciar';
    }

    function switchNextMode() {
      if (state.currentMode === 'work') {
        state.cyclesCompleted++;
        if (state.cyclesCompleted % 4 === 0) {
          state.currentMode = 'longBreak';
          state.timeLeft = state.longBreak;
        } else {
          state.currentMode = 'shortBreak';
          state.timeLeft = state.shortBreak;
        }
        playNotificationSound('break');
      } else {
        state.currentMode = 'work';
        state.timeLeft = state.workTime;
        playNotificationSound('work');
      }

      if (state.isRunning) {
        state.endTime = Date.now() + (state.timeLeft * 1000);
      }
      updateUI();
    }

    function tick() {
      const now = Date.now();
      const remaining = Math.ceil((state.endTime - now) / 1000);
      if (remaining <= 0) {
        switchNextMode();
      } else {
        state.timeLeft = remaining;
        updateUI();
      }
    }

    function toggleTimer() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (state.isRunning) {
        clearInterval(state.timerInterval);
        state.isRunning = false;
      } else {
        state.isRunning = true;
        state.endTime = Date.now() + (state.timeLeft * 1000);
        state.timerInterval = setInterval(tick, 500);
      }
      updateUI();
    }

    function resetTimer() {
      clearInterval(state.timerInterval);
      state.isRunning = false;
      if (state.currentMode === 'work') state.timeLeft = state.workTime;
      else if (state.currentMode === 'shortBreak') state.timeLeft = state.shortBreak;
      else state.timeLeft = state.longBreak;
      updateUI();
    }

    function skipCycle() {
      switchNextMode();
    }

    function setPreset(workMinutes, breakMinutes) {
      clearInterval(state.timerInterval);
      state.isRunning = false;
      state.workTime = workMinutes * 60;
      state.shortBreak = breakMinutes * 60;
      state.longBreak = (breakMinutes * 3) * 60;
      state.currentMode = 'work';
      state.timeLeft = state.workTime;

      dom.btnPreset25.classList.toggle('active-preset', workMinutes === 25);
      dom.btnPreset50.classList.toggle('active-preset', workMinutes === 50);
      updateUI();
    }

    // --- YOUTUBE API FIX (Uso de origin estricto y dominio estándar) ---
    let player = null;
    function extractYouTubeID(input) {
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/)([^#\&\?]*).*/;
      const match = trimmed.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('ytPlayer', {
        videoId: state.videoId,
        playerVars: {
          autoplay: 1,
          controls: 0,
          loop: 1,
          playlist: state.videoId,
          enablejsapi: 1,
          origin: window.location.origin // Asigna correctamente https://jvit04.github.io
        },
        events: {
          onReady: (e) => {
            e.target.playVideo();
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) player.playVideo();
          }
        }
      });
    };

    function loadNewVideo() {
      const id = extractYouTubeID(dom.ytInput.value);
      if (!id) {
        alert('Ingresa una URL o ID válido de YouTube.');
        return;
      }
      state.videoId = id;
      localStorage.setItem(STORAGE_KEY, id);
      if (player && player.loadVideoById) {
        player.loadVideoById({ videoId: id });
      }
      dom.ytInput.value = '';
    }

    function toggleMute() {
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        dom.btnToggleMute.textContent = '🔊';
      } else {
        player.mute();
        dom.btnToggleMute.textContent = '🔇';
      }
    }

    dom.btnStartPause.addEventListener('click', toggleTimer);
    dom.btnReset.addEventListener('click', resetTimer);
    dom.btnSkip.addEventListener('click', skipCycle);
    dom.btnLoadVideo.addEventListener('click', loadNewVideo);
    dom.ytInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loadNewVideo(); });
    dom.btnToggleMute.addEventListener('click', toggleMute);
    dom.btnPreset25.addEventListener('click', () => setPreset(25, 5));
    dom.btnPreset50.addEventListener('click', () => setPreset(50, 10));

    updateUI();
  </script>
</body>
</html>
